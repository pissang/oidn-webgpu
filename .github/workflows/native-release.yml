name: Publish native release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Native crate version (must match native/Cargo.toml)'
        type: string
        required: true
        default: '0.1.0'
      publish:
        description: 'Publish GitHub Release assets and upload the crate to crates.io'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-native-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check the exact native version and source commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/native-release.mjs plan --version "$RELEASE_VERSION"

  verify:
    needs: plan
    uses: ./.github/workflows/native.yml

  publish:
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    env:
      # Bootstrap token is optional. Once Trusted Publishing is configured,
      # remove it and the OIDC action supplies a short-lived token instead.
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: oidn-webgpu-release-${{ github.sha }}
          path: .native-build/release-assets
      - name: Restore the verified crate source
        run: node scripts/native-release.mjs stage
      - name: Final publish dry-run
        run: cargo publish --dry-run --locked --allow-dirty --manifest-path .native-build/crate-stage/Cargo.toml
      - name: Authenticate with crates.io Trusted Publishing
        if: env.CARGO_REGISTRY_TOKEN == ''
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
      - name: Publish permanent native assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/native-release.mjs upload
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --allow-dirty --manifest-path .native-build/crate-stage/Cargo.toml
