[package]
name = "oidn-webgpu-native"
version = "0.1.1"
edition = "2024"
# Own code is MIT; bundled cores also contain scriptc, V8-derived code and Ryū.
license = "MIT AND Apache-2.0 AND BSD-3-Clause AND BSL-1.0"
description = "Experimental GPU denoising on host-owned wgpu devices and buffers, with a standalone C API"
publish = ["crates-io"]
repository = "https://github.com/pissang/oidn-webgpu"
homepage = "https://github.com/pissang/oidn-webgpu"
readme = "README.md"
include = ["Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE", "licenses/**", "build.rs", "build_support/*.rs", "prebuilt/**", "src/**", "include/**", "examples/**/*.rs", "examples/**/*.hlsl", "examples/*.c", "examples/*.m", "examples/*.mm", "examples/*.cpp", "examples/*.md"]

[lib]
name = "oidn_webgpu"
# rlib for Rust tools, cdylib/staticlib for the C API (include/oidn_webgpu.h).
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
wgpu = { version = "=30.0.1" }
pollster = "0.4"
ash = "0.38"

[features]
# Source-only validation helper; no additional C exports or production behavior.
interop-validation = []

[build-dependencies]
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
naga = { version = "30.0.0", features = ["wgsl-in", "spv-out"] }

[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.8"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"

# Size-checked release settings shared by local and precompiled C builds.
# Keep panic unwinding intact for the C API's catch_unwind. Downstream hosts
# select their own profiles.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.profiling]
inherits = "release"
strip = "none"
debug = "line-tables-only"
